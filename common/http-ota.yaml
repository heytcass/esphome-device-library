# HTTP-based OTA Updates
# Include this package AFTER base.yaml to enable automatic firmware updates from GitHub Releases
#
# Prerequisites:
# - GitHub Actions must build and publish firmware binaries
# - Device must have internet access to GitHub
# - ${firmware_name} substitution must be defined (set in hardware device file)
#
# Usage in device config:
# packages:
#   base: !include ../../common/base.yaml
#   http_ota: !include ../../common/http-ota.yaml  # Add this line
#   platform: !include ../../common/esp8266-platform.yaml
#   hardware: !include ../../devices/brand/model.yaml  # Sets firmware_name
#   ...

# Project info for version tracking
# Dashboard builds get "0.0.0", GitHub Action builds get the release tag
# Using 0.0.0 ensures any release version (1.0.0, 2.0.0, etc.) is considered newer
esphome:
  project:
    name: "heytcass.esphome-device-library"
    version: !env_var FIRMWARE_VERSION 0.0.0

# Required component for HTTP requests
# verify_ssl defaults to true (ESP32 ESP-IDF); ESP8266 devices should set to false
http_request:
  verify_ssl: ${verify_ssl}
  timeout: 10min

# Add HTTP OTA platform (supplements esphome platform from base.yaml)
ota:
  - platform: http_request
    id: ota_http_request

# Firmware update component
# Checks GitHub Pages for new firmware via JSON manifest (no redirects, ESP-friendly)
# Uses ${firmware_name} substitution set by hardware device file
update:
  - platform: http_request
    id: update_http_request
    name: "Firmware Update"
    source: "https://heytcass.github.io/esphome-device-library/${firmware_name}-manifest.json"
    update_interval: 6h
