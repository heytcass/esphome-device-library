# Sonoff S31 - Base Configuration
# This is the adoptable config - users import this when adopting in ESPHome Dashboard
# For pre-built firmware with auto-updates, see sonoff-s31.factory.yaml

substitutions:
  device_name: sonoff-s31
  friendly_name: "Sonoff S31"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true

packages:
  base: !include ../common/base.yaml
  platform: !include ../common/esp8266-platform.yaml
  diagnostics: !include ../common/diagnostics.yaml
  hardware: !include ../devices/sonoff/s31.yaml
