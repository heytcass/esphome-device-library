# Base configuration for ALL ESPHome devices
# Universal services that work on any platform
#
# WiFi credentials are NOT compiled in - they're provisioned via:
# - Captive portal (connect to device AP, enter credentials)
# - Improv Serial (USB provisioning)
# - Improv BLE (Bluetooth provisioning, ESP32 only)
#
# Credentials are stored in NVS and persist across OTA updates.

logger:
  level: INFO
  logs:
    component: ERROR

# API for Home Assistant connection
# Uses a default key - users can override in their config if desired
api:
  encryption:
    key: "XZMX08sq9cBFIdnY21lnPT0ixuMWjEsMBBGMVBdmFPE="
  reboot_timeout: 15min

# OTA updates
ota:
  - platform: esphome
    password: "esphome-device-library"

safe_mode:

captive_portal:

mdns:
  disabled: false

# WiFi - no compiled credentials, uses stored credentials from NVS
# On first boot, device creates AP for provisioning via captive portal
wifi:
  ap:
    ssid: "${friendly_name} Setup"
    password: "esphome123"

time:
  - platform: homeassistant
    id: homeassistant_time

interval:
  - interval: 5min
    then:
      - logger.log: "Device healthy"
