# Shelly 1 hardware definition
# ESP8266-based in-wall smart switch

esp8266:
  board: esp01_1m

# Modern WiFi provisioning via USB serial (ESPHome 2024+)
improv_serial:

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
    name: "Switch Input"
    id: switch_input
    entity_category: diagnostic
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - switch.toggle: relay

switch:
  - platform: gpio
    name: "Relay"
    id: relay
    pin: GPIO4
    restore_mode: RESTORE_DEFAULT_OFF
