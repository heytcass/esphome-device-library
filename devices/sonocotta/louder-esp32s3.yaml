# Sonocotta Louder ESP32-S3 hardware definition
# TAS5805M DAC-based audio media player with Sendspin (Spotify Connect)
#
# EXPERIMENTAL: This device requires external components from unmerged PRs.
# These may change or break. Use at your own risk.
#
# Hardware: https://github.com/sonocotta/esp32-tas5805m-dac
# Product: https://sonocotta.com/louder-esp32/

substitutions:
  firmware_name: "sonocotta-louder-esp32s3"
  # Substitution for PSRAM task allocation (use "false" for non-S3)
  task_stack_in_psram: "true"
  # DAC configuration
  dac_analog_gain: "-6db"
  dac_volume_min: "-60db"

# Board configuration
esp32:
  board: esp32-s3-devkitc-1

# Enable IPv6 for network features
network:
  enable_ipv6: true

# -----------------------------------------------------------------------------
# EXTERNAL COMPONENTS (EXPERIMENTAL)
# These are from unmerged PRs or beta releases - they may change without notice
# -----------------------------------------------------------------------------
external_components:
  # TAS5805M DAC driver (beta)
  - source: github://mrtoy-me/esphome-tas5805m@beta
    components: [tas5805m]
    refresh: 0s

  # Audio mixer for announcement ducking
  - source: github://pr#12253
    components: [mixer]
    refresh: 0s

  # Audio resampler for format conversion
  - source: github://pr#12254
    components: [resampler]
    refresh: 0s

  # Enhanced audio component
  - source: github://pr#12256
    components: [audio]
    refresh: 0s

  # Enhanced media player
  - source: github://pr#12258
    components: [media_player]
    refresh: 0s

  # Sendspin (Spotify Connect) and mDNS fixes
  - source: github://pr#12284
    components: [mdns, sendspin]
    refresh: 0s

  # Media sources (file, HTTP, speaker_source)
  - source: github://pr#12429
    components: [file, http_request, media_source, speaker_source]
    refresh: 0s

# -----------------------------------------------------------------------------
# I2C BUS (for DAC control)
# -----------------------------------------------------------------------------
i2c:
  sda: GPIO8
  scl: GPIO9
  frequency: 400kHz
  scan: true
  timeout: 100us

# -----------------------------------------------------------------------------
# I2S AUDIO OUTPUT
# -----------------------------------------------------------------------------
i2s_audio:
  i2s_lrclk_pin: GPIO15
  i2s_bclk_pin: GPIO14

# -----------------------------------------------------------------------------
# TAS5805M DAC
# -----------------------------------------------------------------------------
audio_dac:
  - platform: tas5805m
    id: tas5805m_dac
    enable_pin: GPIO17
    dac_mode: BTL          # Bridge Tied Load - 2Ch Stereo
    mixer_mode: STEREO
    analog_gain: ${dac_analog_gain}
    volume_min: ${dac_volume_min}
    update_interval: 5s

# -----------------------------------------------------------------------------
# AUDIO PIPELINE
# I2S -> Mixer (for ducking) -> Resampler -> Media Player
# -----------------------------------------------------------------------------
speaker:
  - platform: i2s_audio
    id: i2s_speaker_id
    sample_rate: 48000
    i2s_dout_pin: GPIO16
    bits_per_sample: 16bit
    dac_type: external
    channel: stereo
    timeout: never
    buffer_duration: 100ms
    audio_dac: tas5805m_dac

  - platform: mixer
    id: mixer_speaker_id
    output_speaker: i2s_speaker_id
    num_channels: 2
    task_stack_in_psram: ${task_stack_in_psram}
    source_speakers:
      - id: announcement_mixer_input
        timeout: never
      - id: media_mixer_input
        timeout: never

  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixer_input
    sample_rate: 48000
    bits_per_sample: 16

  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixer_input
    sample_rate: 48000
    bits_per_sample: 16

# -----------------------------------------------------------------------------
# SENDSPIN (SPOTIFY CONNECT)
# -----------------------------------------------------------------------------
sendspin:
  id: sendspin_hub
  task_stack_in_psram: ${task_stack_in_psram}
  kalman_process_error: 0.01

# -----------------------------------------------------------------------------
# MEDIA SOURCES
# -----------------------------------------------------------------------------
media_source:
  - platform: sendspin
    id: sendspin_source
  - platform: http_request
    id: http_source
    buffer_size: 200000
  - platform: file
    id: file_source
    files:
      id: startup_sync_sound
      file: https://github.com/mrtoy-me/esphome-tas5805m/raw/main/components/tas5805m/tas5805m_boot_louder.flac

# -----------------------------------------------------------------------------
# MEDIA PLAYERS
# -----------------------------------------------------------------------------
media_player:
  - platform: sendspin
    id: sendspin_group_media_player

  - platform: speaker_source
    id: external_media_player
    name: "Media Player"
    announcement_speaker: announcement_resampling_speaker
    media_speaker: media_resampling_speaker
    announcement_pipeline:
      format: FLAC
      num_channels: 1
      sample_rate: 48000
    media_pipeline:
      format: FLAC
      num_channels: 2
      sample_rate: 48000
    volume_increment: 0.05
    sources:
      - file_source
      - http_source
      - sendspin_source
    on_announcement:
      - if:
          condition:
            - lambda: return (!id(announcement_triggered));
          then:
            - lambda: |-
                id(announcement_triggered) = true;
                id(current_volume) = id(external_media_player).volume;
            - mixer_speaker.apply_ducking:
                id: media_mixer_input
                decibel_reduction: 40
                duration: 0.0s
            - wait_until:
                media_player.is_announcing: external_media_player
            - delay: 0.75s
            - media_player.volume_set:
                id: external_media_player
                volume: !lambda "return id(announce_volume).state / 100.0;"
            - wait_until:
                - not:
                    media_player.is_announcing: external_media_player
            - mixer_speaker.apply_ducking:
                id: media_mixer_input
                decibel_reduction: 0
                duration: 1.0s
            - media_player.volume_set:
                id: external_media_player
                volume: !lambda "return id(current_volume);"
            - lambda: id(announcement_triggered) = false;
    on_state:
      if:
        condition:
          and:
            - lambda: return (!id(announcement_triggered));
            - not:
                media_player.is_announcing: external_media_player
        then:
          - mixer_speaker.apply_ducking:
              id: media_mixer_input
              decibel_reduction: 0
              duration: 1.0s

# -----------------------------------------------------------------------------
# GLOBALS (for announcement ducking)
# -----------------------------------------------------------------------------
globals:
  - id: current_volume
    type: float
    initial_value: '0.2'
  - id: announcement_triggered
    type: bool
    initial_value: 'false'

# -----------------------------------------------------------------------------
# TEXT SENSORS (Now Playing)
# -----------------------------------------------------------------------------
text_sensor:
  - platform: sendspin
    type: title
    name: "Track Title"

  - platform: sendspin
    type: artist
    name: "Artist"

  - platform: sendspin
    type: album
    name: "Album"

# -----------------------------------------------------------------------------
# CONTROLS
# -----------------------------------------------------------------------------
number:
  - platform: template
    name: "Announce Volume"
    id: announce_volume
    icon: mdi:volume-source
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    restore_value: true
    initial_value: 50
    optimistic: true

  # 15-band equalizer
  - platform: tas5805m
    eq_gain_band20Hz:
      name: "EQ 20Hz"
    eq_gain_band31.5Hz:
      name: "EQ 31.5Hz"
    eq_gain_band50Hz:
      name: "EQ 50Hz"
    eq_gain_band80Hz:
      name: "EQ 80Hz"
    eq_gain_band125Hz:
      name: "EQ 125Hz"
    eq_gain_band200Hz:
      name: "EQ 200Hz"
    eq_gain_band315Hz:
      name: "EQ 315Hz"
    eq_gain_band500Hz:
      name: "EQ 500Hz"
    eq_gain_band800Hz:
      name: "EQ 800Hz"
    eq_gain_band1250Hz:
      name: "EQ 1250Hz"
    eq_gain_band2000Hz:
      name: "EQ 2000Hz"
    eq_gain_band3150Hz:
      name: "EQ 3150Hz"
    eq_gain_band5000Hz:
      name: "EQ 5000Hz"
    eq_gain_band8000Hz:
      name: "EQ 8000Hz"
    eq_gain_band16000Hz:
      name: "EQ 16000Hz"

switch:
  - platform: tas5805m
    enable_dac:
      name: "DAC Power"
      id: enable_dac
      restore_mode: ALWAYS_ON
    enable_eq:
      name: "EQ Enable"
      restore_mode: RESTORE_DEFAULT_ON

# -----------------------------------------------------------------------------
# DAC DIAGNOSTICS
# -----------------------------------------------------------------------------
sensor:
  - platform: tas5805m
    faults_cleared:
      name: "DAC Faults Cleared"

binary_sensor:
  - platform: tas5805m
    have_fault:
      name: "DAC Fault"
      exclude: CLOCK_FAULT
    left_channel_dc_fault:
      name: "Left Channel DC Fault"
    right_channel_dc_fault:
      name: "Right Channel DC Fault"
    left_channel_over_current:
      name: "Left Channel Over Current"
    right_channel_over_current:
      name: "Right Channel Over Current"
    otp_crc_check:
      name: "OTP CRC Fault"
    bq_write_failed:
      name: "BQ Write Failure"
    pcdd_over_voltage:
      name: "PCDD Over Voltage"
    pcdd_under_voltage:
      name: "PCDD Under Voltage"
    over_temp_shutdown:
      name: "Over Temperature Shutdown"
    over_temp_warning:
      name: "Over Temperature Warning"
      id: over_temperature_warning

# Restart button provided by common/diagnostics.yaml
