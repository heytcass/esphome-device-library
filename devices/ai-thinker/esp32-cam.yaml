# AI-Thinker ESP32-CAM hardware definition
# ESP32-based camera module with OV2640 sensor

esp32:
  board: esp32cam
  framework:
    type: esp-idf

# Modern WiFi provisioning via USB serial (ESPHome 2024+)
improv_serial:

# Camera configuration
esp32_camera:
  name: "Camera"
  id: camera
  external_clock:
    pin: GPIO0
    frequency: 20MHz
  i2c_pins:
    sda: GPIO26
    scl: GPIO27
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  power_down_pin: GPIO32
  resolution: 1024x768
  jpeg_quality: 10
  max_framerate: 10fps
  vertical_flip: false
  horizontal_mirror: false

# White LED flash
output:
  - platform: ledc
    pin: GPIO4
    id: camera_flash
    channel: 2  # Camera uses PWM channel 1

light:
  - platform: monochromatic
    name: "Flash"
    id: flash
    output: camera_flash
    restore_mode: RESTORE_DEFAULT_OFF

# Red status LED
status_led:
  pin:
    number: GPIO33
    inverted: true

# Available GPIOs for additional sensors/switches:
# GPIO1 (TX), GPIO3 (RX), GPIO12, GPIO13, GPIO14, GPIO15
# WARNING: DO NOT USE GPIO16 - connected to PSRAM
