# Sonoff 4CH Pro R2 hardware definition
# ESP8266-based 4-channel relay module

esp8266:
  board: esp01_1m

# Modern WiFi provisioning via USB serial (ESPHome 2024+)
improv_serial:

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    name: "Button 1"
    id: button_1
    entity_category: diagnostic
    internal: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      - switch.toggle: relay_1

  - platform: gpio
    pin:
      number: GPIO9
      mode: INPUT_PULLUP
      inverted: true
    name: "Button 2"
    id: button_2
    entity_category: diagnostic
    internal: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      - switch.toggle: relay_2

  - platform: gpio
    pin:
      number: GPIO10
      mode: INPUT_PULLUP
      inverted: true
    name: "Button 3"
    id: button_3
    entity_category: diagnostic
    internal: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      - switch.toggle: relay_3

  - platform: gpio
    pin:
      number: GPIO14
      mode: INPUT_PULLUP
      inverted: true
    name: "Button 4"
    id: button_4
    entity_category: diagnostic
    internal: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      - switch.toggle: relay_4

switch:
  - platform: gpio
    name: "Relay 1"
    id: relay_1
    pin: GPIO12
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    name: "Relay 2"
    id: relay_2
    pin: GPIO5
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    name: "Relay 3"
    id: relay_3
    pin: GPIO4
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    name: "Relay 4"
    id: relay_4
    pin: GPIO15
    restore_mode: RESTORE_DEFAULT_OFF

# Status LEDs (one per relay)
output:
  - platform: gpio
    pin: GPIO13
    inverted: true
    id: led_1_gpio

  - platform: gpio
    pin: GPIO12
    inverted: true
    id: led_2_gpio

  - platform: gpio
    pin: GPIO14
    inverted: true
    id: led_3_gpio

  - platform: gpio
    pin: GPIO16
    inverted: true
    id: led_4_gpio

light:
  - platform: binary
    name: "LED 1"
    id: led_1
    internal: true
    output: led_1_gpio

  - platform: binary
    name: "LED 2"
    id: led_2
    internal: true
    output: led_2_gpio

  - platform: binary
    name: "LED 3"
    id: led_3
    internal: true
    output: led_3_gpio

  - platform: binary
    name: "LED 4"
    id: led_4
    internal: true
    output: led_4_gpio
