# Sonoff S31 - Factory Configuration
# This is the productized config built by GitHub Actions for pre-built firmware
# Extends base config with HTTP OTA updates, Improv provisioning, and dashboard adoption

packages:
  device: !include sonoff-s31.yaml
  http_ota: !include ../common/http-ota.yaml

# Enable adoption in ESPHome Dashboard
# Points to BASE config so adopted devices get clean config without HTTP OTA
dashboard_import:
  package_import_url: github://heytcass/esphome-device-library/firmware/sonoff-s31.yaml@main
  import_full_config: false

# Serial provisioning for ESP8266 (no BLE)
improv_serial:
