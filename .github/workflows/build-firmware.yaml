name: Build Firmware

on:
  push:
    branches: [main]
    # Pushing a version tag builds firmware, creates the GitHub Release
    # with assets, and deploys manifests to Pages. (GitHub does not apply
    # path filters to tag pushes.)
    tags: ["v*"]
    paths:
      - "firmware/**"
      - "common/**"
      - "devices/**"
      - ".github/workflows/build-firmware.yaml"
  pull_request:
    paths:
      - "firmware/**"
      - "common/**"
      - "devices/**"
      - ".github/workflows/build-firmware.yaml"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - config: firmware/wyze-outdoor-plug.factory.yaml
            chip_family: ESP32
          - config: firmware/sonoff-s31.factory.yaml
            chip_family: ESP8266
          - config: firmware/seeed-reterminal-e1002.factory.yaml
            chip_family: ESP32-S3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESPHome
        run: pip install esphome

      - name: Create secrets.yaml
        run: |
          cat > secrets.yaml << EOF
          wifi_ssid: "test-network"
          wifi_password: "test-password"
          api_encryption_key: "rBPmvFdSW1At4ksEt3ut050Vcx6mVIeXBc46XNKF3Q8="
          ota_password: "test-ota-password"
          ap_password: "test-ap-password"
          EOF

      - name: Determine firmware version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="dev"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Compile firmware
        env:
          FIRMWARE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Strip 'v' prefix if present
          export FIRMWARE_VERSION="${FIRMWARE_VERSION#v}"
          esphome compile ${{ matrix.config }}

      - name: Find firmware binary
        id: firmware
        run: |
          FIRMWARE_PATH=$(find . -path "*/.pioenvs/*/firmware.bin" 2>/dev/null | head -1)

          if [ -z "${FIRMWARE_PATH}" ] || [ ! -f "${FIRMWARE_PATH}" ]; then
            echo "Error: Firmware not found"
            find . -name "firmware.bin" 2>/dev/null || true
            exit 1
          fi

          DEVICE_NAME=$(basename $(dirname "${FIRMWARE_PATH}"))

          echo "path=${FIRMWARE_PATH}" >> $GITHUB_OUTPUT
          echo "device_name=${DEVICE_NAME}" >> $GITHUB_OUTPUT

      - name: Generate MD5 checksum
        id: md5
        run: |
          DEVICE_NAME="${{ steps.firmware.outputs.device_name }}"
          FIRMWARE_PATH="${{ steps.firmware.outputs.path }}"
          MD5=$(md5sum "${FIRMWARE_PATH}" | cut -d' ' -f1)
          echo "${MD5}" > "${DEVICE_NAME}.md5"
          echo "hash=${MD5}" >> $GITHUB_OUTPUT

      - name: Generate manifest.json
        run: |
          DEVICE_NAME="${{ steps.firmware.outputs.device_name }}"
          CHIP_FAMILY="${{ matrix.chip_family }}"
          MD5="${{ steps.md5.outputs.hash }}"
          VERSION="${{ steps.version.outputs.version }}"
          VERSION="${VERSION#v}"

          cat > "${DEVICE_NAME}-manifest.json" << EOF
          {
            "name": "${DEVICE_NAME}",
            "version": "${VERSION}",
            "home_assistant_domain": "esphome",
            "builds": [
              {
                "chipFamily": "${CHIP_FAMILY}",
                "ota": {
                  "path": "${DEVICE_NAME}.bin",
                  "md5": "${MD5}"
                }
              }
            ]
          }
          EOF

      - name: Rename firmware binary
        run: |
          DEVICE_NAME="${{ steps.firmware.outputs.device_name }}"
          FIRMWARE_PATH="${{ steps.firmware.outputs.path }}"
          cp "${FIRMWARE_PATH}" "${DEVICE_NAME}.bin"

      - name: Upload firmware as artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.firmware.outputs.device_name }}
          path: |
            ${{ steps.firmware.outputs.device_name }}.bin
            ${{ steps.firmware.outputs.device_name }}.md5
            ${{ steps.firmware.outputs.device_name }}-manifest.json
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: firmware
          pattern: firmware-*
          merge-multiple: true

      - name: List downloaded files
        run: ls -la firmware/

      # Creates the GitHub Release for the tag if it doesn't exist yet
      # (tag-push flow), or adds assets to it (release-published flow).
      # Done here rather than per-matrix so the release is created once.
      - name: Publish release with firmware assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            firmware/*.bin
            firmware/*.md5
            firmware/*-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./firmware
          keep_files: false
          commit_message: "Deploy firmware ${{ github.event.release.tag_name || github.ref_name }}"
