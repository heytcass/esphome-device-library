# M5Stack Tab5 with Sendspin - Factory Configuration
# This is the productized config built by GitHub Actions for pre-built firmware
# Extends base config with HTTP OTA updates, Improv provisioning, and dashboard adoption

packages:
  device: !include sendspin-tab5.yaml
  http_ota: !include ../common/http-ota.yaml

# Enable adoption in ESPHome Dashboard
# Points to BASE config so adopted devices get clean config without HTTP OTA
dashboard_import:
  package_import_url: github://heytcass/esphome-device-library/firmware/sendspin-tab5.yaml@main
  import_full_config: false

# Serial provisioning
improv_serial:

# Note: Tab5 uses ESP32-P4 with hosted ESP32-C6 for WiFi
# BLE improv (esp32_improv) may not work with hosted WiFi - needs testing
