# Firmware build config for AirGradient ONE v9
# Users flash this, then adopt via ESPHome dashboard with their own name

substitutions:
  device_name: airgradient-one
  friendly_name: "AirGradient ONE"
  led_strip_brightness: "25%"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true  # Ensures unique names when multiple devices use same firmware
  project:
    name: "heytcass.esphome-device-library"
    version: !env_var FIRMWARE_VERSION dev

packages:
  base: !include ../common/base.yaml
  http_ota: !include ../common/http-ota.yaml
  platform: !include ../common/esp32-platform.yaml
  diagnostics: !include ../common/diagnostics.yaml
  web_server: !include ../common/web-server.yaml
  hardware: !include ../devices/airgradient/one-v9.yaml

wifi:
  ap:
    ssid: "${friendly_name} Fallback"
