# Sonocotta Louder ESP32-S3 - Factory Configuration
# This is the productized config built by GitHub Actions for pre-built firmware
# Extends base config with HTTP OTA updates, Improv provisioning, and dashboard adoption

packages:
  device: !include sonocotta-louder-esp32s3.yaml
  http_ota: !include ../common/http-ota.yaml

esphome:
  project:
    name: "heytcass.esphome-device-library"
    version: !env_var FIRMWARE_VERSION dev

# Enable adoption in ESPHome Dashboard
# Points to BASE config so adopted devices get clean config without HTTP OTA
dashboard_import:
  package_import_url: github://heytcass/esphome-device-library/firmware/sonocotta-louder-esp32s3.yaml@main
  import_full_config: false

# Serial provisioning
improv_serial:

# BLE provisioning for ESP32-S3
esp32_improv:
  authorizer: none
