# Sendspin Tab5 - Example Configuration
# M5Stack Tab5 with Sendspin media display
# Original config by @balloob (Paulus Schoutsen)
#
# Copy this file and customize for your device.
#
# First boot:
# 1. Flash using ESPHome web installer or CLI
# 2. Device creates WiFi AP: "sendspin-tab5 Fallback"
# 3. Connect and configure WiFi

substitutions:
  device_name: sendspin-tab5-living-room  # Change this! Must be unique
  friendly_name: "Living Room Tab5"  # Change this! Shows in Home Assistant

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2025.5.0

packages:
  base:
    url: https://github.com/heytcass/esphome-device-library
    ref: main
    files:
      - common/base.yaml
      - common/diagnostics.yaml
      - common/sendspin/base.yaml
      - common/sendspin/metadata.yaml
      - common/sendspin/artwork.yaml
      - common/sendspin/player.yaml
      - common/sendspin/controller.yaml
      - devices/sendspin/tab5.yaml
    refresh: 1d

wifi:
  ap:
    ssid: "${device_name} Fallback"
