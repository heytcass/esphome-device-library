name: Build Firmware

on:
  release:
    types: [published]
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          # One firmware per device type
          - firmware/wyze-outdoor-plug.yaml
          - firmware/sonoff-s31.yaml
          - firmware/athom-pg01v3-eu.yaml
          - firmware/airgradient-one-v9.yaml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESPHome
        run: pip install esphome

      - name: Create secrets.yaml
        run: |
          cat > secrets.yaml << EOF
          wifi_ssid: "test-network"
          wifi_password: "test-password"
          api_encryption_key: "rBPmvFdSW1At4ksEt3ut050Vcx6mVIeXBc46XNKF3Q8="
          ota_password: "test-ota-password"
          ap_password: "test-ap-password"
          wifi_gateway: "192.168.1.1"
          wifi_subnet: "255.255.255.0"
          EOF

      - name: Compile firmware
        env:
          # Strip 'v' prefix for consistent version comparison (e.g., v1.0.8 -> 1.0.8)
          FIRMWARE_VERSION: ${{ github.event.release.tag_name && format('{0}', github.event.release.tag_name) || 'dev' }}
        run: |
          # Strip 'v' prefix if present
          export FIRMWARE_VERSION="${FIRMWARE_VERSION#v}"
          esphome compile ${{ matrix.config }}

      - name: Find firmware binary
        id: firmware
        run: |
          # ESPHome builds to <config_dir>/.esphome/build/<device_name>/.pioenvs/<device_name>/firmware.bin
          # Find the firmware binary dynamically
          FIRMWARE_PATH=$(find . -path "*/.pioenvs/*/firmware.bin" 2>/dev/null | head -1)

          if [ -z "${FIRMWARE_PATH}" ] || [ ! -f "${FIRMWARE_PATH}" ]; then
            echo "Error: Firmware not found"
            find . -name "firmware.bin" 2>/dev/null || true
            exit 1
          fi

          # Extract device name from the path (the directory name inside .pioenvs/)
          DEVICE_NAME=$(basename $(dirname "${FIRMWARE_PATH}"))

          # Determine chip family from the config file
          if grep -q "esp32-platform.yaml" "${{ matrix.config }}"; then
            CHIP_FAMILY="ESP32"
          elif grep -q "esp8266-platform.yaml" "${{ matrix.config }}"; then
            CHIP_FAMILY="ESP8266"
          else
            CHIP_FAMILY="ESP32"  # Default fallback
          fi

          echo "path=${FIRMWARE_PATH}" >> $GITHUB_OUTPUT
          echo "device_name=${DEVICE_NAME}" >> $GITHUB_OUTPUT
          echo "chip_family=${CHIP_FAMILY}" >> $GITHUB_OUTPUT

      - name: Generate MD5 checksum
        id: md5
        run: |
          DEVICE_NAME="${{ steps.firmware.outputs.device_name }}"
          FIRMWARE_PATH="${{ steps.firmware.outputs.path }}"
          MD5=$(md5sum "${FIRMWARE_PATH}" | cut -d' ' -f1)
          echo "${MD5}" > "${DEVICE_NAME}.md5"
          echo "hash=${MD5}" >> $GITHUB_OUTPUT

      - name: Generate manifest.json
        run: |
          DEVICE_NAME="${{ steps.firmware.outputs.device_name }}"
          CHIP_FAMILY="${{ steps.firmware.outputs.chip_family }}"
          MD5="${{ steps.md5.outputs.hash }}"
          # Strip 'v' prefix from version for proper comparison (e.g., v1.0.8 -> 1.0.8)
          VERSION="${{ github.event.release.tag_name || 'dev' }}"
          VERSION="${VERSION#v}"

          cat > "${DEVICE_NAME}-manifest.json" << EOF
          {
            "name": "${DEVICE_NAME}",
            "version": "${VERSION}",
            "home_assistant_domain": "esphome",
            "builds": [
              {
                "chipFamily": "${CHIP_FAMILY}",
                "ota": {
                  "path": "${DEVICE_NAME}.bin",
                  "md5": "${MD5}"
                }
              }
            ]
          }
          EOF

      - name: Rename firmware binary
        run: |
          DEVICE_NAME="${{ steps.firmware.outputs.device_name }}"
          FIRMWARE_PATH="${{ steps.firmware.outputs.path }}"
          cp "${FIRMWARE_PATH}" "${DEVICE_NAME}.bin"

      - name: Upload firmware to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ steps.firmware.outputs.device_name }}.bin
            ${{ steps.firmware.outputs.device_name }}.md5
            ${{ steps.firmware.outputs.device_name }}-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload firmware as artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.firmware.outputs.device_name }}
          path: |
            ${{ steps.firmware.outputs.device_name }}.bin
            ${{ steps.firmware.outputs.device_name }}.md5
            ${{ steps.firmware.outputs.device_name }}-manifest.json
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write

    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: firmware
          pattern: firmware-*
          merge-multiple: true

      - name: List downloaded files
        run: ls -la firmware/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./firmware
          keep_files: false
          commit_message: "Deploy firmware ${{ github.event.release.tag_name }}"
