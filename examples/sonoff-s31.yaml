# Sonoff S31 - Example Configuration
# WiFi Smart Plug with Power Monitoring
#
# Copy this file and customize the substitutions for your device.
#
# First boot:
# 1. Device creates WiFi AP: "<device_name> Fallback"
# 2. Connect to AP with password: esphome123
# 3. Open http://192.168.4.1 in browser
# 4. Enter your WiFi credentials
# 5. Device reboots and connects to your network
#
# After initial flash, the device will receive automatic OTA updates
# when new releases are published to the GitHub repository.

substitutions:
  device_name: sonoff-s31-kitchen       # Change this! Must be unique per device
  friendly_name: "Kitchen Smart Plug"   # Change this! Shows in Home Assistant

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

packages:
  base:
    url: https://github.com/heytcass/esphome-device-library
    ref: main
    files:
      - common/base.yaml
      - common/http-ota.yaml
      - common/esp8266-platform.yaml
      - common/diagnostics.yaml
      - devices/sonoff/s31.yaml
    refresh: 1d

wifi:
  ap:
    ssid: "${device_name} Fallback"
