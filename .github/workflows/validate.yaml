name: Validate ESPHome Configs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          - examples/wyze-outdoor-plug.yaml
          - examples/sonoff-s31.yaml
          - examples/sonocotta-louder-esp32s3.yaml
          - examples/sendspin-eink-display.yaml
          # Tab5 uses ESP32-P4 (experimental) - validate locally
          # - examples/sendspin-tab5.yaml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESPHome
        run: pip install esphome

      - name: Create secrets.yaml
        run: |
          cat > secrets.yaml << EOF
          wifi_ssid: "test-network"
          wifi_password: "test-password"
          api_encryption_key: "rBPmvFdSW1At4ksEt3ut050Vcx6mVIeXBc46XNKF3Q8="
          ota_password: "test-ota-password"
          ap_password: "test-ap-password"
          EOF

      - name: Validate ${{ matrix.config }}
        run: esphome config ${{ matrix.config }}
