# Wyze Outdoor Plug - Base Configuration
# This is the adoptable config - users import this when adopting in ESPHome Dashboard
# For pre-built firmware with auto-updates, see wyze-outdoor-plug.factory.yaml

substitutions:
  device_name: wyze-outdoor-plug
  friendly_name: "Wyze Outdoor Plug"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true

packages:
  base: !include ../common/base.yaml
  platform: !include ../common/esp32-platform.yaml
  diagnostics: !include ../common/diagnostics.yaml
  hardware: !include ../devices/wyze/outdoor-plug.yaml

wifi:
  ap:
    ssid: "${friendly_name} Fallback"
