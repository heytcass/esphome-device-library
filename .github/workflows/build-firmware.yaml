name: Build Firmware

on:
  push:
    branches: [main]
    # Pushing a version tag builds firmware, creates the GitHub Release
    # with assets, and deploys manifests to Pages. (GitHub does not apply
    # path filters to tag pushes.)
    tags: ["v*"]
    paths:
      - "firmware/**"
      - "common/**"
      - "devices/**"
      - ".github/workflows/build-firmware.yaml"
  pull_request:
    paths:
      - "firmware/**"
      - "common/**"
      - "devices/**"
      - ".github/workflows/build-firmware.yaml"
  release:
    types: [published]
  # Monthly rebuild against the current ESPHome release. If neither
  # ESPHome nor this repo has changed since the last release, the run
  # stops early instead of reflashing the fleet with identical firmware.
  # Otherwise it publishes the next patch release automatically, so
  # devices keep receiving current ESPHome without maintainer action.
  #
  # Timing: ESPHome ships X.Y.0 on the third Wednesday of each month
  # (day 15-21), then patch releases over the following days. Running on
  # the 28th puts us 7-13 days after every X.Y.0, so the fleet gets a
  # settled release rather than day-one .0. The 28th is also the latest
  # day present in every month, so no month is ever skipped.
  schedule:
    - cron: "17 7 28 * *"
  # Dispatching with a version (e.g. v3.0.0) runs the full release
  # pipeline: build, create the tag + GitHub Release with assets, and
  # deploy manifests to Pages. Without a version it's a plain test build.
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag to create (e.g. v3.0.0); empty = test build only"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only supersede superseded PR runs; never cancel a release mid-publish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides, once per run, what version to build and whether to release.
  # Keeping this out of the build matrix means the three device jobs and
  # the deploy job can't disagree about the version.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      proceed: ${{ steps.decide.outputs.proceed }}
      do_release: ${{ steps.decide.outputs.do_release }}
      esphome_version: ${{ steps.esphome.outputs.version }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESPHome
        run: pip install esphome

      - name: Read ESPHome version
        id: esphome
        run: |
          ESPHOME_VERSION=$(pip show esphome | awk '/^Version:/ {print $2}')
          echo "version=${ESPHOME_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building with ESPHome ${ESPHOME_VERSION}"

      - name: Decide version and release intent
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ESPHOME_VERSION: ${{ steps.esphome.outputs.version }}
        run: |
          set -euo pipefail
          PROCEED=true
          DO_RELEASE=false
          VERSION="dev"

          if [ "${EVENT}" = "release" ]; then
            VERSION="${RELEASE_TAG}"
            DO_RELEASE=true
          elif [ "${EVENT}" = "workflow_dispatch" ] && [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
            DO_RELEASE=true
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            DO_RELEASE=true
          elif [ "${EVENT}" = "schedule" ]; then
            # What did the last release ship? build-info.json is written to
            # GitHub Pages by the deploy job below.
            PREV=$(gh api "repos/${GITHUB_REPOSITORY}/contents/build-info.json?ref=gh-pages" \
              --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d 2>/dev/null || echo '{}')
            PREV_ESPHOME=$(echo "${PREV}" | jq -r '.esphome_version // empty')
            PREV_COMMIT=$(echo "${PREV}" | jq -r '.source_commit // empty')

            if [ "${PREV_ESPHOME}" = "${ESPHOME_VERSION}" ] && [ "${PREV_COMMIT}" = "${GITHUB_SHA}" ]; then
              PROCEED=false
              echo "No rebuild needed: ESPHome ${ESPHOME_VERSION} and source" \
                "${GITHUB_SHA} both match the last release." >> "$GITHUB_STEP_SUMMARY"
            else
              LAST_TAG=$(gh release view --json tagName --jq '.tagName' 2>/dev/null || echo "")
              if [ -z "${LAST_TAG}" ]; then
                VERSION="v0.0.1"
              else
                BASE="${LAST_TAG#v}"
                MAJOR="${BASE%%.*}"
                REST="${BASE#*.}"
                MINOR="${REST%%.*}"
                PATCH="${REST#*.}"
                # Drop any pre-release suffix (e.g. 3.0.1-rc1 -> 3.0.1).
                PATCH="${PATCH%%-*}"
                VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
              fi
              DO_RELEASE=true
              {
                echo "Rebuilding as ${VERSION}."
                echo "- ESPHome: ${PREV_ESPHOME:-none} -> ${ESPHOME_VERSION}"
                echo "- Source: ${PREV_COMMIT:-none} -> ${GITHUB_SHA}"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "proceed=${PROCEED}" >> "$GITHUB_OUTPUT"
          echo "do_release=${DO_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION} proceed=${PROCEED} do_release=${DO_RELEASE}"

  build:
    needs: prepare
    if: needs.prepare.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - config: firmware/wyze-outdoor-plug.factory.yaml
            chip_family: ESP32
          - config: firmware/sonoff-s31.factory.yaml
            chip_family: ESP8266
          - config: firmware/seeed-reterminal-e1002.factory.yaml
            chip_family: ESP32-S3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Pinned to the version prepare resolved, so a mid-run ESPHome
      # release can't make the three devices build against different cores.
      - name: Install ESPHome
        run: pip install "esphome==${{ needs.prepare.outputs.esphome_version }}"

      - name: Create secrets.yaml
        run: |
          cat > secrets.yaml << EOF
          wifi_ssid: "test-network"
          wifi_password: "test-password"
          api_encryption_key: "rBPmvFdSW1At4ksEt3ut050Vcx6mVIeXBc46XNKF3Q8="
          ota_password: "test-ota-password"
          ap_password: "test-ap-password"
          EOF

      - name: Compile firmware
        env:
          FIRMWARE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Strip 'v' prefix if present
          export FIRMWARE_VERSION="${FIRMWARE_VERSION#v}"
          esphome compile ${{ matrix.config }}

      - name: Find firmware binary
        id: firmware
        run: |
          FIRMWARE_PATH=$(find . -path "*/.pioenvs/*/firmware.bin" 2>/dev/null | head -1)

          if [ -z "${FIRMWARE_PATH}" ] || [ ! -f "${FIRMWARE_PATH}" ]; then
            echo "Error: Firmware not found"
            find . -name "firmware.bin" 2>/dev/null || true
            exit 1
          fi

          DEVICE_NAME=$(basename $(dirname "${FIRMWARE_PATH}"))

          echo "path=${FIRMWARE_PATH}" >> $GITHUB_OUTPUT
          echo "device_name=${DEVICE_NAME}" >> $GITHUB_OUTPUT

      - name: Generate MD5 checksum
        id: md5
        run: |
          DEVICE_NAME="${{ steps.firmware.outputs.device_name }}"
          FIRMWARE_PATH="${{ steps.firmware.outputs.path }}"
          MD5=$(md5sum "${FIRMWARE_PATH}" | cut -d' ' -f1)
          echo "${MD5}" > "${DEVICE_NAME}.md5"
          echo "hash=${MD5}" >> $GITHUB_OUTPUT

      - name: Generate manifest.json
        run: |
          DEVICE_NAME="${{ steps.firmware.outputs.device_name }}"
          CHIP_FAMILY="${{ matrix.chip_family }}"
          MD5="${{ steps.md5.outputs.hash }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          VERSION="${VERSION#v}"

          cat > "${DEVICE_NAME}-manifest.json" << EOF
          {
            "name": "${DEVICE_NAME}",
            "version": "${VERSION}",
            "home_assistant_domain": "esphome",
            "builds": [
              {
                "chipFamily": "${CHIP_FAMILY}",
                "ota": {
                  "path": "${DEVICE_NAME}.bin",
                  "md5": "${MD5}"
                }
              }
            ]
          }
          EOF

      - name: Rename firmware binary
        run: |
          DEVICE_NAME="${{ steps.firmware.outputs.device_name }}"
          FIRMWARE_PATH="${{ steps.firmware.outputs.path }}"
          cp "${FIRMWARE_PATH}" "${DEVICE_NAME}.bin"

      - name: Upload firmware as artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.firmware.outputs.device_name }}
          path: |
            ${{ steps.firmware.outputs.device_name }}.bin
            ${{ steps.firmware.outputs.device_name }}.md5
            ${{ steps.firmware.outputs.device_name }}-manifest.json
          retention-days: 7

  deploy:
    needs: [prepare, build]
    if: needs.prepare.outputs.do_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: firmware
          pattern: firmware-*
          merge-multiple: true

      - name: List downloaded files
        run: ls -la firmware/

      # Records what this release was built from. The monthly rebuild
      # reads it back to decide whether anything actually changed.
      - name: Write build-info.json
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ESPHOME_VERSION: ${{ needs.prepare.outputs.esphome_version }}
        run: |
          jq -n \
            --arg version "${VERSION#v}" \
            --arg esphome_version "${ESPHOME_VERSION}" \
            --arg source_commit "${GITHUB_SHA}" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '$ARGS.named' > firmware/build-info.json
          cat firmware/build-info.json

      # Creates the tag and GitHub Release if they don't exist yet
      # (tag-push, dispatch-with-version and scheduled flows), or adds
      # assets to the existing release (release-published flow). Done here
      # rather than per-matrix so the release is created once.
      - name: Publish release with firmware assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: |
            firmware/*.bin
            firmware/*.md5
            firmware/*-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./firmware
          keep_files: false
          commit_message: "Deploy firmware ${{ needs.prepare.outputs.version }}"

  # A failed monthly rebuild is the maintainer's to-do list, so turn it
  # into an issue instead of a red badge nobody is watching.
  report-failure:
    needs: [prepare, build, deploy]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Open or update the rebuild-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ESPHOME_VERSION: ${{ needs.prepare.outputs.esphome_version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create automated-rebuild \
            --description "Opened by the scheduled firmware rebuild" \
            --color D93F0B 2>/dev/null || true

          BODY=$(printf '%s\n' \
            "The scheduled monthly firmware rebuild failed." \
            "" \
            "- ESPHome version: \`${ESPHOME_VERSION:-unknown}\`" \
            "- Commit: \`${GITHUB_SHA}\`" \
            "- Run: ${RUN_URL}" \
            "" \
            "Devices keep running their current firmware until this is fixed." \
            "The usual cause is an upstream ESPHome change that a device" \
            "config needs to catch up with.")

          EXISTING=$(gh issue list --state open --label automated-rebuild \
            --limit 1 --json number --jq '.[0].number // empty')

          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --body "${BODY}"
          else
            gh issue create --title "Monthly firmware rebuild failed" \
              --label automated-rebuild --body "${BODY}"
          fi
