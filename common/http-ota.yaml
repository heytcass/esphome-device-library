# HTTP-based OTA Updates
# Include this package AFTER base.yaml to enable automatic firmware updates from GitHub Releases
#
# Prerequisites:
# - GitHub Actions must build and publish firmware binaries
# - Device must have internet access to GitHub
# - ${firmware_name} substitution must be defined (set in hardware device file)
#
# Usage in device config:
# packages:
#   base: !include ../../common/base.yaml
#   http_ota: !include ../../common/http-ota.yaml  # Add this line
#   platform: !include ../../common/esp8266-platform.yaml
#   hardware: !include ../../devices/brand/model.yaml  # Sets firmware_name
#   ...

# Required component for HTTP requests
http_request:
  verify_ssl: false  # Required for HTTPS on ESP8266; ESP32 with ESP-IDF can verify certificates
  timeout: 10min

# Override OTA configuration from base.yaml
ota:
  - platform: http_request

# Firmware update component
# Checks GitHub Releases for new firmware via JSON manifest
# Uses ${firmware_name} substitution set by hardware device file
update:
  - platform: http_request
    name: "Firmware Update"
    source: "https://github.com/heytcass/esphome-device-library/releases/latest/download/${firmware_name}-manifest.json"
    update_interval: 6h  # Check for updates every 6 hours
