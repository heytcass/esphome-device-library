# Wyze Outdoor Plug - Example Configuration
# Copy this file and customize the substitutions for your device
#
# Getting Started:
# 1. In ESPHome Dashboard, click "New Device" → "Continue" → "Skip"
# 2. Name your device (e.g., "wyzeoutdoor-patio")
# 3. Click "Edit" and paste this configuration
# 4. Update the substitutions below with your device name
# 5. Click "Install" and choose your installation method
#
# After initial flash, the device will receive automatic OTA updates
# when new releases are published to the GitHub repository.

substitutions:
  device_name: wyze-outdoor-plug-patio     # Change this! Must be unique per device
  friendly_name: "Patio Outdoor Plug"      # Change this! Shows in Home Assistant

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

packages:
  base:
    url: https://github.com/heytcass/esphome-device-library
    ref: main
    files:
      - common/base.yaml
      - common/http-ota.yaml
      - common/esp32-platform.yaml
      - common/diagnostics.yaml
      - devices/wyze/outdoor-plug.yaml
    refresh: 1d

wifi:
  ap:
    ssid: "${device_name} Fallback"
