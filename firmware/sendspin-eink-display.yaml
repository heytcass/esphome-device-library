# Sendspin E-Ink Display - Base Configuration
# This is the adoptable config - users import this when adopting in ESPHome Dashboard
# For pre-built firmware with auto-updates, see sendspin-eink-display.factory.yaml

substitutions:
  device_name: sendspin-eink-display
  friendly_name: "Sendspin E-Ink Display"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  min_version: 2025.12.2

packages:
  # Core infrastructure
  base: !include ../common/base.yaml
  platform: !include ../common/esp32-platform.yaml
  diagnostics: !include ../common/diagnostics.yaml
  # Sendspin roles (display-only: metadata + artwork + player for state)
  sendspin_base: !include ../common/sendspin/base.yaml
  sendspin_metadata: !include ../common/sendspin/metadata.yaml
  sendspin_artwork: !include ../common/sendspin/artwork.yaml
  sendspin_player: !include ../common/sendspin/player.yaml
  # Device hardware
  hardware: !include ../devices/sendspin/eink-display.yaml

wifi:
  ap:
    ssid: "${device_name} Fallback"
