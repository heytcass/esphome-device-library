# ESP32 platform configuration
# Works for all ESP32 variants (esp32, esp32s2, esp32s3, esp32c3, etc.)

substitutions:
  verify_ssl: "true"  # ESP-IDF has proper TLS support

esp32:
  # board: set in device file or hardware template
  framework:
    type: esp-idf
    version: recommended
    # ESP-IDF framework has proper TLS support required for HTTPS OTA from GitHub Pages
    # Will become default for all ESP32 in ESPHome 2026.1.0
